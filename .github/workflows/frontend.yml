name: Frontend checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Check provider evidence report contracts
        run: npm run test:provider-check
        working-directory: frontend
      - name: Install browser system dependencies
        run: bash scripts/install-browser-deps.sh
        timeout-minutes: 5
      - name: Install Chromium headless shell
        run: npx --no-install playwright install --only-shell chromium
        timeout-minutes: 3
        working-directory: frontend
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
      - run: npm run test:e2e
        working-directory: frontend
