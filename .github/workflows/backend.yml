name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: capitalscope_test
          POSTGRES_USER: capitalscope
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capitalscope -d capitalscope_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/capitalscope_test
      TEST_DATABASE_USER: capitalscope
      TEST_DATABASE_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash scripts/build.sh
      - run: bash scripts/smoke-test.sh
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:integration
        working-directory: frontend
